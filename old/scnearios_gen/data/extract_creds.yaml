services:
  airflow:
    - credential: "airflow_web_ui_username"
      parameterPath: "auth.username"
      description: "Username to access web UI"
      level: "LocalUser"
    - credential: "airflow_web_ui_admin_password"
      parameterPath: "auth.password"
      description: "Password to access web UI"
      level: "Admin"
    - credential: "airflow_fernet_encryption_key"
      parameterPath: "auth.fernetKey"
      description: "Fernet key to secure connections"
      level: "System"
    - credential: "airflow_flask_app_secret_key"
      parameterPath: "auth.secretKey"
      description: "Secret key to run your flask app"
      level: "System"
    - credential: "airflow_flask_app_jwt_secret_key"
      parameterPath: "auth.jwtSecretKey"
      description: "JWT secret key to run your flask app"
      level: "System"
    - credential: "airflow_dags_git_ssh_key"
      parameterPath: "dags.sshKey"
      description: "SSH Private key used to clone/sync DAGs from Git repositories"
      level: "System"
    - credential: "airflow_plugins_git_ssh_key"
      parameterPath: "plugins.sshKey"
      description: "SSH Private key used to clone/sync plugins from Git repositories"
      level: "System"
    - credential: "airflow_webserver_tls_key"
      parameterPath: "web.tls.key"
      description: "TLS key for Airflow webserver"
      level: "System"
    - credential: "airflow_ldap_bind_dn"
      parameterPath: "ldap.binddn"
      description: "DN of the account used to search in the LDAP server"
      level: "System"
    - credential: "airflow_ldap_bind_password"
      parameterPath: "ldap.bindpw"
      description: "Bind Password"
      level: "System"
    - credential: "airflow_dependent_postgresql_user_password"
      parameterPath: "postgresql.auth.password"
      description: "Password for the custom user to create (for the dependent PostgreSQL)"
      level: "LocalUser"
    - credential: "airflow_external_database_user"
      parameterPath: "externalDatabase.user"
      description: "Non-root username for Airflow (for an external database)"
      level: "LocalUser"
    - credential: "airflow_external_database_password"
      parameterPath: "externalDatabase.password"
      description: "Password for the non-root username for Airflow (for an external database)"
      level: "LocalUser"
    - credential: "airflow_external_database_sql_connection_string"
      parameterPath: "externalDatabase.sqlConnection"
      description: "SQL connection string (which contains credentials)"
      level: "LocalUser"
    - credential: "airflow_dependent_redis_password"
      parameterPath: "redis.auth.password"
      description: "Redis® password (for the dependent Redis chart)"
      level: "Admin"
    - credential: "airflow_external_redis_username"
      parameterPath: "externalRedis.username"
      description: "Redis® username (for an external Redis)"
      level: "System"
    - credential: "airflow_external_redis_password"
      parameterPath: "externalRedis.password"
      description: "Redis® password (for an external Redis)"
      level: "Admin"
  apache:
    - credential: "apache_htdocs_git_ssh_key"
      parameterPath: "cloneHtdocsFromGit.sshKey"
      description: "Implied SSH Private key used to clone the htdocs Git repository. (Based on initContainer in deployment.yaml)"
      level: "System"
    - credential: "apache_ingress_tls_secret"
      parameterPath: "ingress.tls.secretName"
      description: "A secret containing the TLS private key for securing the Ingress hostname. (Based on ingress.yaml)"
      level: "System"
    - credential: "apache_extra_ingress_tls_secret"
      parameterPath: "ingress.extraTls.secretName"
      description: "Additional secrets containing TLS private keys for extra Ingress hosts. (Based on ingress.yaml)"
      level: "System"
    - credential: "apache_extra_environment_variables_secret"
      parameterPath: "extraEnvVarsSecret"
      description: "A reference to an existing secret to inject any custom credentials as environment variables. (Based on deployment.yaml)"
      level: "System"
  apisix:
    - credential: "apisix_control_plane_admin_api_token"
      parameterPath: "controlPlane.apiTokenAdmin"
      description: "Admin API Token for APISIX control plane."
      level: "Admin"
    - credential: "apisix_control_plane_viewer_api_token"
      parameterPath: "controlPlane.apiTokenViewer"
      description: "Viewer API Token for APISIX control plane."
      level: "LocalUser"
    - credential: "apisix_dependent_etcd_root_password"
      parameterPath: "etcd.auth.rbac.rootPassword"
      description: "etcd root password (for the dependent etcd chart)."
      level: "Admin"
    - credential: "apisix_external_etcd_password"
      parameterPath: "externalEtcd.password"
      description: "Password of the external etcd instance."
      level: "System"
    - credential: "apisix_data_plane_tls_key"
      parameterPath: "dataPlane.tls.key"
      description: "Content of the TLS private key to be added to the data plane secret."
      level: "System"
    - credential: "apisix_control_plane_tls_key"
      parameterPath: "controlPlane.tls.key"
      description: "Content of the TLS private key to be added to the control plane secret."
      level: "System"
    - credential: "apisix_ingress_controller_tls_key"
      parameterPath: "ingressController.tls.key"
      description: "Content of the TLS private key to be added to the ingress controller secret."
      level: "System"
    - credential: "apisix_global_image_pull_secrets"
      parameterPath: "global.imagePullSecrets"
      description: "Global Docker registry secret names as an array (a reference to credentials)."
      level: "System"
    - credential: "apisix_data_plane_ingress_tls_key"
      parameterPath: "dataPlane.ingress.secrets[].key"
      description: "TLS private key for a custom Ingress secret (PEM format)."
      level: "System"
    - credential: "apisix_consumer_basicauth_password"
      parameterPath: "apisixconsumers.spec.authParameter.basicAuth.value.password"
      description: "Password for a basicAuth ApisixConsumer custom resource."
      level: "LocalUser"
    - credential: "apisix_consumer_keyauth_api_key"
      parameterPath: "apisixconsumers.spec.authParameter.keyAuth.value.key"
      description: "API key for a keyAuth ApisixConsumer custom resource."
      level: "LocalUser"
    - credential: "apisix_consumer_jwtauth_key"
      parameterPath: "apisixconsumers.spec.authParameter.jwtAuth.value.key"
      description: "JWT key or secret for a jwtAuth ApisixConsumer custom resource."
      level: "LocalUser"
    - credential: "apisix_consumer_hmacauth_secret_key"
      parameterPath: "apisixconsumers.spec.authParameter.hmacAuth.value.secret_key"
      description: "HMAC secret key for an hmacAuth ApisixConsumer custom resource."
      level: "LocalUser"
    - credential: "apisix_consumer_ldapauth_user_dn"
      parameterPath: "apisixconsumers.spec.authParameter.ldapAuth.value.user_dn"
      description: "User DN for an ldapAuth ApisixConsumer custom resource."
      level: "LocalUser"
    - credential: "apisix_apisixtls_secret_reference"
      parameterPath: "apisixtlses.spec.secret"
      description: "Reference to the secret containing the server's TLS certificate and private key."
      level: "System"
  appsmith:
    - credential: "appsmith_admin_password"
      parameterPath: "backend.adminPassword"
      description: "Appsmith admin password."
      level: "Admin"
    - credential: "appsmith_admin_user"
      parameterPath: "backend.adminUser"
      description: "Appsmith admin user."
      level: "LocalUser"
    - credential: "appsmith_database_encryption_salt"
      parameterPath: "backend.encryptionSalt"
      description: "Appsmith database encryption salt."
      level: "System"
    - credential: "appsmith_database_encryption_password"
      parameterPath: "backend.encryptionPassword"
      description: "Appsmith database encryption password."
      level: "System"
    - credential: "appsmith_external_mongodb_username"
      parameterPath: "externalDatabase.username"
      description: "Non-root username for Appsmith (for external MongoDB)."
      level: "LocalUser"
    - credential: "appsmith_external_mongodb_password"
      parameterPath: "externalDatabase.password"
      description: "Password for the non-root username for Appsmith (for external MongoDB)."
      level: "LocalUser"
    - credential: "appsmith_dependent_mongodb_usernames"
      parameterPath: "mongodb.auth.usernames[]"
      description: "MongoDB non-root username creation (for dependent MongoDB)."
      level: "LocalUser"
    - credential: "appsmith_dependent_redis_password"
      parameterPath: "redis.auth.password"
      description: "Redis password (for dependent Redis)."
      level: "Admin"
    - credential: "appsmith_external_redis_password"
      parameterPath: "externalRedis.password"
      description: "Password for the Redis (for external Redis)."
      level: "Admin"
    - credential: "appsmith_global_image_pull_secrets"
      parameterPath: "global.imagePullSecrets"
      description: "Global Docker registry secret names as an array."
      level: "System"
    - credential: "appsmith_client_ingress_tls_key"
      parameterPath: "client.ingress.secrets[].key"
      description: "Custom TLS private key for the Ingress."
      level: "System"
  argocd:
    - credential: "argocd_server_admin_password"
      parameterPath: "config.secret.argocdServerAdminPassword"
      description: "Argo CD server admin password. Autogenerated by default."
      level: "Admin"
    - credential: "argocd_github_webhook_secret"
      parameterPath: "config.secret.githubSecret"
      description: "GitHub secret to configure webhooks."
      level: "System"
    - credential: "argocd_gitlab_webhook_secret"
      parameterPath: "config.secret.gitlabSecret"
      description: "GitLab secret to configure webhooks."
      level: "System"
    - credential: "argocd_bitbucket_server_webhook_secret"
      parameterPath: "config.secret.bitbucketServerSecret"
      description: "BitBucket secret to configure webhooks."
      level: "System"
    - credential: "argocd_gogs_webhook_secret"
      parameterPath: "config.secret.gogsSecret"
      description: "Gogs secret to configure webhooks."
      level: "System"
    - credential: "argocd_server_tls_key"
      parameterPath: "config.secret.argocdServerTlsConfig.key"
      description: "TLS private key for the Argo CD config secret."
      level: "System"
    - credential: "argocd_git_repository_credentials"
      parameterPath: "config.secret.repositoryCredentials"
      description: "Repository credentials (like SSH private keys) to add to the Argo CD secret."
      level: "System"
    - credential: "argocd_external_cluster_bearer_token"
      parameterPath: "config.clusterCredentials[].config.bearerToken"
      description: "A bearer token for authenticating to an external Kubernetes cluster."
      level: "System"
    - credential: "argocd_dependent_redis_password"
      parameterPath: "redis.auth.password"
      description: "Password for the dependent Redis chart (if auth is enabled)."
      level: "Admin"
    - credential: "argocd_external_redis_password"
      parameterPath: "externalRedis.password"
      description: "Password for connecting to an external Redis instance."
      level: "Admin"
    - credential: "argocd_global_image_pull_secrets"
      parameterPath: "global.imagePullSecrets"
      description: "Global Docker registry secret names as an array (a reference to credentials)."
      level: "System"
    - credential: "argocd_appproject_role_jwt"
      parameterPath: "AppProject.spec.roles[].jwtTokens"
      description: "JWT tokens generated for a specific role within an AppProject."
      level: "LocalUser"
    - credential: "argocd_applicationset_github_pr_token"
      parameterPath: "ApplicationSet.spec.generators[].pullRequest.github.tokenRef"
      description: "Reference to a secret containing a GitHub token for the ApplicationSet pull request generator."
      level: "System"
    - credential: "argocd_applicationset_gitlab_pr_token"
      parameterPath: "ApplicationSet.spec.generators[].pullRequest.gitlab.tokenRef"
      description: "Reference to a secret containing a GitLab token for the ApplicationSet pull request generator."
      level: "System"
    - credential: "argocd_applicationset_bitbucket_pr_password"
      parameterPath: "ApplicationSet.spec.generators[].pullRequest.bitbucket.basicAuth.passwordRef"
      description: "Reference to a secret containing a Bitbucket basic auth password."
      level: "System"
    - credential: "argocd_applicationset_scm_github_token"
      parameterPath: "ApplicationSet.spec.generators[].scmProvider.github.tokenRef"
      description: "Reference to a secret containing a GitHub token for the SCM provider generator."
      level: "System"
    - credential: "argocd_applicationset_scm_bitbucket_app_password"
      parameterPath: "ApplicationSet.spec.generators[].scmProvider.bitbucket.appPasswordRef"
      description: "Reference to a secret containing a Bitbucket app password for the SCM provider generator."
      level: "System"
    - credential: "argocd_applicationset_scm_azure_devops_token"
      parameterPath: "ApplicationSet.spec.generators[].scmProvider.azureDevOps.accessTokenRef"
      description: "Reference to a secret containing an Azure DevOps access token."
      level: "System"
  argoworkflows:
    - credential: "argoworkflows_sso_oidc_client_id_secret_key"
      parameterPath: "server.auth.sso.config.clientId.key"
      description: "The key within the specified secret to get the OIDC client ID from."
      level: "System"
    - credential: "argoworkflows_sso_oidc_client_secret_key"
      parameterPath: "server.auth.sso.config.clientSecret.key"
      description: "The key within the specified secret to get the OIDC client secret from."
      level: "System"
    - credential: "argoworkflows_dependent_postgresql_password"
      parameterPath: "postgresql.auth.password"
      description: "Password for the dependent PostgreSQL database."
      level: "Admin"
    - credential: "argoworkflows_dependent_mysql_password"
      parameterPath: "mysql.auth.password"
      description: "Password for the dependent MySQL database."
      level: "Admin"
    - credential: "argoworkflows_external_database_password"
      parameterPath: "externalDatabase.password"
      description: "Password for the external database used for workflow persistence."
      level: "System"
    - credential: "argoworkflows_server_ingress_tls_key"
      parameterPath: "ingress.secrets[].key"
      description: "TLS private key for the server ingress."
      level: "System"
    - credential: "argoworkflows_global_image_pull_secrets"
      parameterPath: "global.imagePullSecrets"
      description: "Global Docker registry secret names as an array."
      level: "System"
    - credential: "argoworkflows_workflow_artifact_s3_access_key"
      parameterPath: "spec.artifactsByNode.artifacts[].s3.accessKeySecret"
      description: "Reference to a secret containing the S3 Access Key ID (defined in a Workflow CRD)."
      level: "System"
    - credential: "argoworkflows_workflow_artifact_s3_secret_key"
      parameterPath: "spec.artifactsByNode.artifacts[].s3.secretKeySecret"
      description: "Reference to a secret containing the S3 Secret Access Key (defined in a Workflow CRD)."
      level: "System"
    - credential: "argoworkflows_workflow_artifact_gcs_service_account_key"
      parameterPath: "spec.artifactsByNode.artifacts[].gcs.serviceAccountKeySecret"
      description: "Reference to a secret containing the GCS Service Account Key (defined in a Workflow CRD)."
      level: "System"
    - credential: "argoworkflows_workflow_artifact_azure_account_key"
      parameterPath: "spec.artifactsByNode.artifacts[].azure.accountKeySecret"
      description: "Reference to a secret containing the Azure Blob Storage Account Key (defined in a Workflow CRD)."
      level: "System"
    - credential: "argoworkflows_workflow_artifact_artifactory_username"
      parameterPath: "spec.artifactsByNode.artifacts[].artifactory.usernameSecret"
      description: "Reference to a secret containing the Artifactory username (defined in a Workflow CRD)."
      level: "System"
    - credential: "argoworkflows_workflow_artifact_artifactory_password"
      parameterPath: "spec.artifactsByNode.artifacts[].artifactory.passwordSecret"
      description: "Reference to a secret containing the Artifactory password (defined in a Workflow CRD)."
      level: "System"
    - credential: "argoworkflows_workflow_artifact_git_ssh_key"
      parameterPath: "spec.artifactsByNode.artifacts[].git.sshPrivateKeySecret"
      description: "Reference to a secret containing an SSH private key for Git (defined in a Workflow CRD)."
      level: "System"
    - credential: "argoworkflows_workflow_artifact_git_password"
      parameterPath: "spec.artifactsByNode.artifacts[].git.passwordSecret"
      description: "Reference to a secret containing a Git password or token (defined in a Workflow CRD)."
      level: "System"
    - credential: "argoworkflows_workflow_artifact_http_basic_auth_password"
      parameterPath: "spec.artifactsByNode.artifacts[].http.auth.basicAuth.passwordSecret"
      description: "Reference to a secret containing a password for HTTP Basic Auth (defined in a Workflow CRD)."
      level: "System"
    - credential: "argoworkflows_workflow_artifact_hdfs_kerberos_keytab"
      parameterPath: "spec.artifactsByNode.artifacts[].hdfs.krbKeytabSecret"
      description: "Reference to a secret containing a Kerberos keytab for HDFS (defined in a Workflow CRD)."
      level: "System"