apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: mysql-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: mysql
    cybersim/generated: 'true'
  name: mysql
  namespace: cybersim-subnet-2
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      annotations:
        cybersim/port: '3306'
        cybersim/service: mysql
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: mysql-instance
        app.kubernetes.io/managed-by: cyberbattlesim
        app.kubernetes.io/name: mysql
        cybersim/generated: 'true'
    spec:
      containers:
      - env:
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        image: mysql:8.0
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 3306
        name: mysql
        ports:
        - containerPort: 3306
          name: main
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: 3306
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
