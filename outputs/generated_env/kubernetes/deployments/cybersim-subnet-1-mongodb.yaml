apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: mongodb-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: mongodb
    cybersim/generated: 'true'
  name: mongodb
  namespace: cybersim-subnet-1
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      annotations:
        cybersim/port: '27017'
        cybersim/service: mongodb
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: mongodb-instance
        app.kubernetes.io/managed-by: cyberbattlesim
        app.kubernetes.io/name: mongodb
        cybersim/generated: 'true'
    spec:
      containers:
      - env:
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        image: mongo:7.0
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 27017
        name: mongodb
        ports:
        - containerPort: 27017
          name: main
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: 27017
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
