apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: prometheus-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: prometheus
    cybersim/generated: 'true'
  name: prometheus
  namespace: cybersim-zone-a
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      annotations:
        cybersim/port: '9090'
        cybersim/service: prometheus
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: prometheus-instance
        app.kubernetes.io/managed-by: cyberbattlesim
        app.kubernetes.io/name: prometheus
        cybersim/generated: 'true'
    spec:
      containers:
      - env:
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        image: prom/prometheus:v2.47.0
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 9090
        name: prometheus
        ports:
        - containerPort: 9090
          name: main
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: 9090
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
