apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: elasticsearch-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: elasticsearch
    cybersim/generated: 'true'
  name: elasticsearch
  namespace: cybersim-subnet-1
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      annotations:
        cybersim/port: '9254'
        cybersim/service: elasticsearch
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: elasticsearch-instance
        app.kubernetes.io/managed-by: cyberbattlesim
        app.kubernetes.io/name: elasticsearch
        cybersim/generated: 'true'
    spec:
      containers:
      - env:
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        image: elasticsearch:8.11.0
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 9254
        name: elasticsearch
        ports:
        - containerPort: 9254
          name: main
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: 9254
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
