apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: kube-state-metrics-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: kube-state-metrics
    cybersim/generated: 'true'
  name: kube-state-metrics
  namespace: cybersim-zone-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      annotations:
        cybersim/port: '8080'
        cybersim/service: kube-state-metrics
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: kube-state-metrics-instance
        app.kubernetes.io/managed-by: cyberbattlesim
        app.kubernetes.io/name: kube-state-metrics
        cybersim/generated: 'true'
    spec:
      containers:
      - env:
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        image: k8s.gcr.io/kube-state-metrics/kube-state-metrics:v2.10.0
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 8080
        name: kube-state-metrics
        ports:
        - containerPort: 8080
          name: main
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: 8080
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
