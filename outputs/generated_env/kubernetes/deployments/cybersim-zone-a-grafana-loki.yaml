apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: grafana-loki-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: grafana-loki
    cybersim/generated: 'true'
  name: grafana-loki
  namespace: cybersim-zone-a
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-loki
  template:
    metadata:
      annotations:
        cybersim/port: '3100'
        cybersim/service: grafana-loki
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: grafana-loki-instance
        app.kubernetes.io/managed-by: cyberbattlesim
        app.kubernetes.io/name: grafana-loki
        cybersim/generated: 'true'
    spec:
      containers:
      - env:
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        image: grafana/loki:2.9.0
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 3100
        name: grafana-loki
        ports:
        - containerPort: 3100
          name: main
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: 3100
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
