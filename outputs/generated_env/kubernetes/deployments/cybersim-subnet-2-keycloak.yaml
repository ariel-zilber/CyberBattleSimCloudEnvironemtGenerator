apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: keycloak-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: keycloak
    cybersim/generated: 'true'
  name: keycloak
  namespace: cybersim-subnet-2
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      annotations:
        cybersim/port: '8080'
        cybersim/service: keycloak
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: keycloak-instance
        app.kubernetes.io/managed-by: cyberbattlesim
        app.kubernetes.io/name: keycloak
        cybersim/generated: 'true'
    spec:
      containers:
      - env:
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        image: quay.io/keycloak/keycloak:24.0.0
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 8080
        name: keycloak
        ports:
        - containerPort: 8080
          name: main
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: 8080
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
