apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: zookeeper-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: zookeeper
    cybersim/generated: 'true'
  name: zookeeper
  namespace: cybersim-zone-a
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      annotations:
        cybersim/port: '3741'
        cybersim/service: zookeeper
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: zookeeper-instance
        app.kubernetes.io/managed-by: cyberbattlesim
        app.kubernetes.io/name: zookeeper
        cybersim/generated: 'true'
    spec:
      containers:
      - image: confluentinc/cp-zookeeper:7.5.0
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 3741
        name: zookeeper
        ports:
        - containerPort: 3741
          name: main
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: 3741
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
