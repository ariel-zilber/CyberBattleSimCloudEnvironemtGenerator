apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: cert-manager-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: cert-manager
    cybersim/generated: 'true'
  name: cert-manager
  namespace: cybersim-subnet-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  template:
    metadata:
      annotations:
        cybersim/port: '9402'
        cybersim/service: cert-manager
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: cert-manager-instance
        app.kubernetes.io/managed-by: cyberbattlesim
        app.kubernetes.io/name: cert-manager
        cybersim/generated: 'true'
    spec:
      containers:
      - image: quay.io/jetstack/cert-manager-controller:v1.13.0
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 9402
        name: cert-manager
        ports:
        - containerPort: 9402
          name: main
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: 9402
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
