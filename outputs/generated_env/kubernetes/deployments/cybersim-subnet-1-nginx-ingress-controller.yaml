apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: nginx-ingress-controller-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: nginx-ingress-controller
    cybersim/generated: 'true'
  name: nginx-ingress-controller
  namespace: cybersim-subnet-1
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-ingress-controller
  template:
    metadata:
      annotations:
        cybersim/port: '332'
        cybersim/service: nginx-ingress-controller
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: nginx-ingress-controller-instance
        app.kubernetes.io/managed-by: cyberbattlesim
        app.kubernetes.io/name: nginx-ingress-controller
        cybersim/generated: 'true'
    spec:
      containers:
      - env:
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        image: nginx:1.25-alpine
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 332
        name: nginx-ingress-controller
        ports:
        - containerPort: 332
          name: main
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: 332
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
