apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: metrics-server-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: metrics-server
    cybersim/generated: 'true'
  name: metrics-server
  namespace: cybersim-zone-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-server
  template:
    metadata:
      annotations:
        cybersim/port: '4032'
        cybersim/service: metrics-server
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: metrics-server-instance
        app.kubernetes.io/managed-by: cyberbattlesim
        app.kubernetes.io/name: metrics-server
        cybersim/generated: 'true'
    spec:
      containers:
      - env:
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        image: busybox:1.36
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 4032
        name: metrics-server
        ports:
        - containerPort: 4032
          name: main
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: 4032
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
