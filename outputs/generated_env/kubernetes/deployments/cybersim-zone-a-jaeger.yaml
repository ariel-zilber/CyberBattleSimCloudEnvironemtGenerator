apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: jaeger-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: jaeger
    cybersim/generated: 'true'
  name: jaeger
  namespace: cybersim-zone-a
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      annotations:
        cybersim/port: '8122'
        cybersim/service: jaeger
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: jaeger-instance
        app.kubernetes.io/managed-by: cyberbattlesim
        app.kubernetes.io/name: jaeger
        cybersim/generated: 'true'
    spec:
      containers:
      - env:
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        - name: ALLOW_REMOTE_DEBUG
          value: 'true'
        image: jaegertracing/all-in-one:1.51
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 8122
        name: jaeger
        ports:
        - containerPort: 8122
          name: main
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: 8122
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
