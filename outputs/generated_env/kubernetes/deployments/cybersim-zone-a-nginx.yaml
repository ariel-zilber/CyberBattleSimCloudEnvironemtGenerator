apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: nginx-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: nginx
    cybersim/generated: 'true'
  name: nginx
  namespace: cybersim-zone-a
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      annotations:
        cybersim/port: '428'
        cybersim/service: nginx
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: nginx-instance
        app.kubernetes.io/managed-by: cyberbattlesim
        app.kubernetes.io/name: nginx
        cybersim/generated: 'true'
    spec:
      containers:
      - image: nginx:1.25-alpine
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 428
        name: nginx
        ports:
        - containerPort: 428
          name: main
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: 428
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
