apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: argo-cd-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: argo-cd
    cybersim/generated: 'true'
  name: argo-cd
  namespace: cybersim-subnet-2
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: argo-cd
  template:
    metadata:
      annotations:
        cybersim/port: '407'
        cybersim/service: argo-cd
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: argo-cd-instance
        app.kubernetes.io/managed-by: cyberbattlesim
        app.kubernetes.io/name: argo-cd
        cybersim/generated: 'true'
    spec:
      containers:
      - image: busybox:1.36
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 407
        name: argo-cd
        ports:
        - containerPort: 407
          name: main
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: 407
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
