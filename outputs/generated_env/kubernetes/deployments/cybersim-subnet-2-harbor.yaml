apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: harbor-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: harbor
    cybersim/generated: 'true'
  name: harbor
  namespace: cybersim-subnet-2
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor
  template:
    metadata:
      annotations:
        cybersim/port: '388'
        cybersim/service: harbor
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: harbor-instance
        app.kubernetes.io/managed-by: cyberbattlesim
        app.kubernetes.io/name: harbor
        cybersim/generated: 'true'
    spec:
      containers:
      - image: goharbor/harbor-core:v2.9.0
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 388
        name: harbor
        ports:
        - containerPort: 388
          name: main
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: 388
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
