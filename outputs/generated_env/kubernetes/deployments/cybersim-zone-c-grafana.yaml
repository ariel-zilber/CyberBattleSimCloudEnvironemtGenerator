apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: grafana-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: grafana
    cybersim/generated: 'true'
  name: grafana
  namespace: cybersim-zone-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      annotations:
        cybersim/port: '3000'
        cybersim/service: grafana
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: grafana-instance
        app.kubernetes.io/managed-by: cyberbattlesim
        app.kubernetes.io/name: grafana
        cybersim/generated: 'true'
    spec:
      containers:
      - image: grafana/grafana:10.2.0
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: 3000
        name: grafana
        ports:
        - containerPort: 3000
          name: main
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 5
          tcpSocket:
            port: 3000
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
