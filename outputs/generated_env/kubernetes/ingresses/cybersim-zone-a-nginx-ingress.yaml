apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
  labels:
    app.kubernetes.io/component: ingress
    app.kubernetes.io/instance: nginx-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: nginx
    cybersim/generated: 'true'
  name: nginx-ingress
  namespace: cybersim-zone-a
spec:
  rules:
  - host: nginx.local
    http:
      paths:
      - backend:
          service:
            name: nginx
            port:
              number: 428
        path: /
        pathType: Prefix
