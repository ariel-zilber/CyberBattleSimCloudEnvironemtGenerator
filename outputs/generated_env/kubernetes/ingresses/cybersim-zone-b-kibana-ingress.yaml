apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
  labels:
    app.kubernetes.io/component: ingress
    app.kubernetes.io/instance: kibana-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: kibana
    cybersim/generated: 'true'
  name: kibana-ingress
  namespace: cybersim-zone-b
spec:
  rules:
  - host: kibana.local
    http:
      paths:
      - backend:
          service:
            name: kibana
            port:
              number: 5601
        path: /
        pathType: Prefix
