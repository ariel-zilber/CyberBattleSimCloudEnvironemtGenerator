apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: service
    app.kubernetes.io/instance: prometheus-instance
    app.kubernetes.io/managed-by: cyberbattlesim
    app.kubernetes.io/name: prometheus
    cybersim/generated: 'true'
  name: prometheus
  namespace: cybersim-zone-b
spec:
  ports:
  - name: main
    port: 9090
    protocol: TCP
    targetPort: 9090
  selector:
    app.kubernetes.io/name: prometheus
  type: ClusterIP
