apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: cyberbattlesim
    cybersim/generated: 'true'
  name: allow-prometheus-to-zookeeper
  namespace: cybersim-subnet-2
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cybersim-zone-a
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - port: 3741
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  policyTypes:
  - Ingress
