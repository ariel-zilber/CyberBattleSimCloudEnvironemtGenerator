    reward_string: Successfully exploited CVE-2023-31439!
  CVE-2022-0563-0:
    description: A flaw was found in the util-linux chfn and chsh utilities when compiled
      with Readline support. The Readline library uses an "INPUTRC" environment variable
      to get a path to the library config file. When the library cannot parse the
      specified file, it prints an error message containing data from the file. This
      flaw allows an unprivileged user to read root-owned files, potentially leading
      to privilege escalation. This flaw affects util-linux versions prior to 2.37.4.
    type: 2
    outcome:
      kwargs:
        level: 3
      type: system_escalation
    precondition:
      expression: 'true'
    rates:
      probingDetectionRate: 0.0
      exploitDetectionRate: 0.0
