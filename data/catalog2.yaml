# ==============================================================================
# CLUSTER SIZING DEFINITIONS
# ==============================================================================
cluster_sizes:
  TINY: [1, 3]          # Dev/testing
  SMALL: [3, 10]        # Small production/startup
  MEDIUM: [10, 50]      # Growing company
  LARGE: [50, 200]      # Enterprise
  XLARGE: [200, 1000]   # Hyperscale

